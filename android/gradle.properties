org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9: the Flutter 3.47.7 Gradle plugin still reads the old DSL, so newDsl stays off
# (AGP reports this option as deprecated). Built-in Kotlin stays on; setting it explicitly
# stops the Flutter migrator from appending android.builtInKotlin=false.
android.newDsl=false
android.builtInKotlin=true
