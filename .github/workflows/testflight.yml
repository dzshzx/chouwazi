name: Upload iOS to TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chouwazi-testflight
  cancel-in-progress: false
jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    # Configure this environment to allow only main before adding its secrets.
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Install fvm (SHA-256 verified) and Flutter (.fvmrc pinned)
        run: bash scripts/ci-setup-fvm.sh
      - name: Verify selected Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Check shared source
        run: bash scripts/check.sh
      - run: fvm flutter precache --ios
      - name: Install iOS engine integration
        working-directory: ios
        run: pod install
      - name: Sign, verify and upload IPA
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bash scripts/testflight.sh
      - name: Remove signing credentials
        if: always()
        shell: bash
        run: bash scripts/testflight-cleanup.sh
