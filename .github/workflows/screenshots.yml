name: Capture iOS App Store screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # scripts/tool.sh runs the Go capture helper; the go line of tool/go.mod pins it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tool/go.mod
          cache: false
      - uses: ./.github/actions/ios-setup
      - name: List available simulators
        run: |
          xcrun simctl list devicetypes
          xcrun simctl list runtimes
      - name: Build the actual simulator app
        run: |
          fvm flutter build ios --simulator --debug --no-codesign --no-pub
          bash scripts/check-ios.sh build/ios/iphonesimulator/Runner.app
      - name: Capture real UI in English, Simplified and Traditional Chinese
        # fvm exec puts the .fvmrc Flutter on PATH; the helper runs flutter directly so stopping
        # `flutter attach` stops Flutter itself (fvm does not forward SIGTERM to its child).
        run: fvm exec bash scripts/tool.sh ios-screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chouwazi-ios-app-store-screenshots
          path: |
            build/app-store-screenshots/**/*.png
            build/app-store-screenshots/manifest.json
          if-no-files-found: error
          retention-days: 30
