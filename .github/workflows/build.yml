name: Build Android and iOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          enable-cache: false
      # scripts/check.sh and scripts/tool.sh run the Go on PATH; the go line of tool/go.mod pins it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tool/go.mod
          cache: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install fvm (SHA-256 verified) and Flutter (.fvmrc pinned)
        run: bash scripts/ci-setup-fvm.sh
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Check shared source
        run: bash scripts/check.sh
      - name: Build offline trial APK
        run: fvm flutter build apk --release --no-pub
      - name: Verify APK signature and permissions
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk
          bash scripts/check-apk.sh "$ANDROID_HOME/build-tools/36.0.0/aapt" build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chouwazi-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  # The shared source gate runs in the android job; this job only builds and checks the iOS apps.
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ios-setup
      - name: Build simulator app
        run: fvm flutter build ios --simulator --debug --no-codesign --no-pub
      - name: Build unsigned device app
        run: fvm flutter build ios --release --no-codesign --no-pub
      - name: Package build artifacts
        run: |
          bash scripts/check-ios.sh build/ios/iphonesimulator/Runner.app build/ios/iphoneos/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/chouwazi-simulator.zip
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/chouwazi-device-unsigned.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chouwazi-ios-builds
          path: |
            build/chouwazi-simulator.zip
            build/chouwazi-device-unsigned.zip
          if-no-files-found: error
