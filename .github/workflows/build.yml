name: Build Android and iOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Override the action default, which includes the unavailable legacy tools package.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test round state
        working-directory: android
        run: |
          mkdir -p build/test-classes
          javac -d build/test-classes app/src/main/java/com/alex/fingerdraw/DrawState.java tests/DrawStateTest.java
          java -cp build/test-classes DrawStateTest
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chouwazi-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test round state
        working-directory: ios
        run: swift test
      - name: Build simulator app
        working-directory: ios
        run: xcodebuild -project Chouwazi.xcodeproj -scheme Chouwazi -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned device app
        working-directory: ios
        run: xcodebuild -project Chouwazi.xcodeproj -scheme Chouwazi -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
      - name: Package build artifacts
        working-directory: ios
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/chouwazi.app build/chouwazi-simulator.zip
          ditto -c -k --sequesterRsrc --keepParent build-device/Build/Products/Release-iphoneos/chouwazi.app build-device/chouwazi-device-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: chouwazi-ios-builds
          path: |
            ios/build/chouwazi-simulator.zip
            ios/build-device/chouwazi-device-unsigned.zip
