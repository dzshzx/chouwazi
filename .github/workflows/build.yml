name: Build Android, iOS and HarmonyOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          enable-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Override the action default, which includes the unavailable legacy tools package.
          packages: 'platform-tools'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.3.11579264'
      - name: Check shared source
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build offline trial APK
        run: flutter build apk --release --no-pub
      - name: Verify APK signature and permissions
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk
          uv run --locked --script scripts/check-apk.py "$ANDROID_HOME/build-tools/35.0.0/aapt" build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chouwazi-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          enable-cache: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Verify selected Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: flutter pub get --enforce-lockfile
      - run: flutter precache --ios
      - name: Install iOS engine integration
        working-directory: ios
        run: pod install
      - name: Build simulator app
        run: flutter build ios --simulator --debug --no-codesign --no-pub
      - name: Build unsigned device app
        run: flutter build ios --release --no-codesign --no-pub
      - name: Package build artifacts
        run: |
          uv run --locked --script scripts/check-ios.py build/ios/iphonesimulator/Runner.app build/ios/iphoneos/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/chouwazi-simulator.zip
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/chouwazi-device-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: chouwazi-ios-builds
          path: |
            build/chouwazi-simulator.zip
            build/chouwazi-device-unsigned.zip
          if-no-files-found: error
  harmony:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          enable-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: .tooling
          key: harmony-linux-x64-sdk-5.1.0.840-flutter-c8a0f037-v1
      - name: Build unsigned HarmonyOS HAP
        run: bash scripts/build-ohos.sh
      - name: Test shared code on Flutter OH
        shell: bash
        run: |
          source scripts/ohos-env.sh
          flutter test --no-pub
          git diff --exit-code -- pubspec.lock
      - uses: actions/upload-artifact@v4
        with:
          name: chouwazi-harmony-hap
          path: build/ohos/chouwazi-unsigned.hap
          if-no-files-found: error
