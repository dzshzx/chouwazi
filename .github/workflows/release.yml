name: Release
# 发版：gh workflow run release.yml --ref main -f bump=patch。版本号由最高的纯 vX.Y.Z tag 按 bump 算出，
# 构建号由版本号按固定公式算出（scripts/release-version.sh），只在构建时传给 Flutter，不提交回仓库。
# 共享源码门禁（scripts/check.sh）与平台无关，只在 Linux 的 gate 作业里跑，且只在输入 gate 打开时跑（-f gate=true）：
# 默认不跑，每个提交合入时已过 wt land 的门禁，手动触发的 build.yml 也跑它。打开时没过就不发布。
# dry_run 走 dry-run 作业（与 gate 并行）：带新版本号构建未签名的 iOS 包并核对版本，不进受保护环境、不签名、不打 tag、不上传。
# 正式发版走 publish 作业（gate 通过或没打开时）：在受保护环境里算版本、签名并核对 IPA，通过后才打 tag、上传。
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 升级档位；minor、major 须维护者先确认
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: 只构建与核对，不签名、不打 tag、不上传
        type: boolean
        default: false
      gate:
        description: 跑全量门禁；默认不跑，合入门禁与每晚 CI 已查过
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: chouwazi-release
  cancel-in-progress: false
jobs:
  gate:
    if: ${{ inputs.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # scripts/lint.sh fetches shellcheck and lizard through uvx.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: false
      # scripts/check.sh runs the Go on PATH; the go line of tool/go.mod pins it.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tool/go.mod
          cache: false
      - name: Install fvm (SHA-256 verified) and Flutter (.fvmrc pinned)
        run: bash scripts/ci-setup-fvm.sh
      - name: Check shared source
        run: bash scripts/check.sh
  dry-run:
    if: ${{ inputs.dry_run }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compute release version
        env:
          BUMP: ${{ inputs.bump }}
        run: bash scripts/release-version.sh "$BUMP"
      - uses: ./.github/actions/ios-setup
      - name: Build unsigned device app with the release version
        run: fvm flutter build ios --release --no-codesign --no-pub --build-name "$RELEASE_VERSION" --build-number "$RELEASE_BUILD"
      # check-ios.sh also checks the app carries RELEASE_VERSION and RELEASE_BUILD.
      - name: Verify the built app
        run: |
          bash scripts/check-ios.sh build/ios/iphoneos/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/chouwazi-device-unsigned.zip
          sha256=$(shasum -a 256 build/chouwazi-device-unsigned.zip | awk '{ print $1 }')
          {
            echo "## 发版试跑（dry_run）"
            echo
            echo "- 将要发布的版本：v$RELEASE_VERSION（iOS 构建号 $RELEASE_BUILD）"
            echo "- source_commit：$GITHUB_SHA"
            echo "- 未签名真机包 chouwazi-device-unsigned.zip 的 sha256：$sha256"
            echo "- 发布渠道是 TestFlight：签名后的 IPA 只在正式发版时生成，其 sha256 写在发布步骤的摘要里。"
          } >>"$GITHUB_STEP_SUMMARY"
  publish:
    # With gate on, the tag is pushed only after the shared source gate has passed; with gate off the skipped gate lets it run.
    if: ${{ !cancelled() && !inputs.dry_run && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    needs: gate
    runs-on: macos-15
    timeout-minutes: 60
    # Configure this environment to allow only main before adding its secrets.
    environment: testflight
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "正式发版只能在默认分支 $DEFAULT_BRANCH 上运行，当前是 $GITHUB_REF；试跑请加 -f dry_run=true。" >&2
            exit 1
          fi
      # --release fails when this commit already carries a release tag.
      - name: Compute release version
        env:
          BUMP: ${{ inputs.bump }}
        run: bash scripts/release-version.sh "$BUMP" --release
      # scripts/testflight.sh runs the Go helper through scripts/tool.sh; the go line of tool/go.mod pins it.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tool/go.mod
          cache: false
      - uses: ./.github/actions/ios-setup
      - name: Write the release version into the Xcode build settings
        run: fvm flutter build ios --config-only --release --no-codesign --no-pub --build-name "$RELEASE_VERSION" --build-number "$RELEASE_BUILD"
      # Checks the signed IPA, including its version and build, before Apple validation.
      - name: Sign, verify and validate IPA
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bash scripts/testflight.sh sign
      - name: Push the annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$RELEASE_VERSION"
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$tag" \
            -f message="chouwazi $RELEASE_VERSION ($RELEASE_BUILD)" -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$object" >/dev/null
          echo "已在 $GITHUB_SHA 上推送附注 tag $tag。"
      - name: Upload IPA to TestFlight
        shell: bash
        run: bash scripts/testflight.sh upload
      # The only place signing material is removed, whether the steps above passed or failed.
      - name: Remove signing credentials
        if: always()
        shell: bash
        run: bash scripts/testflight-cleanup.sh
