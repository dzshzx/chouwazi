name: chouwazi
description: Offline multi-touch drawing game for Android and iOS.
publish_to: none
version: 1.0.4+5
environment:
  sdk: '>=3.13.5 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  config:
    # Keep the existing CocoaPods integration that build.yml, testflight.yml and
    # screenshots.yml install with `pod install`; the app has no plugins to move.
    enable-swift-package-manager: false
